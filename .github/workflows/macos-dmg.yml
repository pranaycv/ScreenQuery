name: macOS DMG and Windows exe

on:
  push:
    branches:
      - cursor/screenquery-macos-app-da12
  workflow_dispatch:

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Python 3.12 with Tk
        id: python
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_ENV_HINTS=1
          framework="/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12"
          if [[ -x "$framework" ]] && "$framework" -c "import tkinter" >/dev/null 2>&1; then
            echo "python=$framework" >> "$GITHUB_OUTPUT"
            "$framework" -c "import sys, tkinter; print(sys.executable, sys.version, 'tk', tkinter.TkVersion)"
            exit 0
          fi
          # Homebrew split Tk out of python@3.12. A link conflict must not hide a usable cellar binary.
          brew install python-tk@3.12 || true
          py="$(brew --prefix python@3.12)/bin/python3.12"
          "$py" -c "import sys, tkinter; print(sys.executable, sys.version, 'tk', tkinter.TkVersion)"
          echo "python=$py" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the settings UI
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build the disk image
        env:
          PYTHON: ${{ steps.python.outputs.python }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh
          mv dist/ScreenQuery.dmg "dist/ScreenQuery-${{ matrix.arch }}.dmg"
          ls -lh "dist/ScreenQuery-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenQuery-${{ matrix.arch }}
          path: dist/ScreenQuery-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    name: Build Windows exe
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the settings UI
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build ScreenQuery.exe
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenQuery-windows
          path: dist/ScreenQuery.exe
          if-no-files-found: error

  release:
    name: Publish test DMGs and exe
    needs: [build, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ScreenQuery-*
          path: dist
          merge-multiple: true

      - name: Attach the disk images to the test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No DMG or exe was produced." >&2
            exit 1
          fi
          ls -lh "${files[@]}"
          if gh release view v1.0.0-test >/dev/null 2>&1; then
            gh release upload v1.0.0-test "${files[@]}" --clobber
            gh release edit v1.0.0-test \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "ScreenQuery test build" \
              --notes-file scripts/release-notes-macos.txt
          else
            gh release create v1.0.0-test "${files[@]}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes-file scripts/release-notes-macos.txt \
              --title "ScreenQuery test build"
          fi
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.windows.result }}" != "success" ]]; then
            echo "A build failed. Publishing the files that succeeded." >&2
            exit 1
          fi
